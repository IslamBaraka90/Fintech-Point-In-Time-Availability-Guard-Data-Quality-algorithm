[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-point-in-time"
version = "0.1.0"
description = "Bitemporal point-in-time filtering — valid time and knowledge time kept separate, with leakage auditing, panel building, restatement history and vintage diffs."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Fintech Builder" }]
keywords = [
  "fintech",
  "point-in-time",
  "bitemporal",
  "lookahead-bias",
  "backtest",
  "data-quality",
  "market-data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Article = "https://thefintechbuilder.com/market-data-engineering/data-quality/point-in-time-availability-guard/"
Homepage = "https://github.com/IslamBaraka90/Fintech-Point-In-Time-Availability-Guard-Data-Quality-algorithm"
Index = "https://github.com/IslamBaraka90/Fintech-Algorithms-Awesome"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
